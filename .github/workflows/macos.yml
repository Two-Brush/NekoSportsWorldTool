name: macOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/macos.yml'
      - 'scripts/package-macos.sh'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'crates/**'
      - 'assets/**'
      - 'vendor/**'

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            arch: arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Test
        run: cargo test --locked --lib

      - name: Build GUI and CLI
        run: cargo build --locked --release --target "${{ matrix.target }}"

      - name: Check executable
        run: |
          file "target/${{ matrix.target }}/release/nekosportsworldtool"
          "target/${{ matrix.target }}/release/nekosportsworldtool" help

      - name: Package app and CLI
        run: bash scripts/package-macos.sh "${{ matrix.target }}" "${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: NekoSportsWorldTool-macos-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
